name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck, test and build
        run: npm run check

      # R1: the job handler must have nowhere to put a hard reset. A developer's
      # uncommitted work shares the tree with the agent on the npx path.
      - name: No hard reset in the sidecar
        run: |
          if grep -rn "reset --hard\|'reset', '--hard'" packages/server/src; then
            echo "packages/server/src must never hard-reset the working tree" >&2
            exit 1
          fi

      - name: The sidecar image builds
        run: docker build -f packages/server/Dockerfile -t tapthat-server:ci .

      - name: Verify the extension packages
        run: npm run package

      - uses: actions/upload-artifact@v4
        with:
          name: tapthat-unpacked
          path: |
            packages/client/manifest.json
            packages/client/dist/
