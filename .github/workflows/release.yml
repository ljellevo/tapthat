name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck, test and build
        run: npm run check

      - name: Package the extension
        run: npm run package

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<'EOF'
          ### Install

          1. Download `agentivision.zip` below and unzip it.
          2. Open `chrome://extensions` (Chrome) or `arc://extensions` (Arc).
          3. Turn on **Developer mode**.
          4. Click **Load unpacked** and select the unzipped folder.

          On `localhost` a floating button appears automatically. Elsewhere, use
          **Alt+Shift+C** or the toolbar icon.
          EOF
          gh release create "$GITHUB_REF_NAME" agentivision.zip \
            --title "$GITHUB_REF_NAME" \
            --notes-file notes.md
