name: Release

on:
  push:
    branches: [main]
    # One version for the extension and tapthat-server: a change to either
    # releases both (the server through server-release.yml, below).
    paths:
      - 'packages/client/**'
      - 'packages/shared/**'
      - 'packages/server/**'
      - '.github/workflows/release.yml'
      - '.github/workflows/server-release.yml'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (major.minor.hotfix), e.g. 1.1.0 for a manual major/minor bump'
        required: true

permissions:
  contents: write
  # To start server-release.yml.
  actions: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Determine version
        id: version
        run: |
          manual="${{ inputs.version }}"
          if [ -n "$manual" ]; then
            if ! [[ "$manual" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "version must be major.minor.hotfix, got: $manual" >&2
              exit 1
            fi
            version="$manual"
          else
            latest="$(git tag --list '[0-9]*.[0-9]*.[0-9]*' | sort -t. -k1,1n -k2,2n -k3,3n | tail -n1)"
            if [ -z "$latest" ]; then
              version="0.1.0"
            else
              IFS=. read -r major minor hotfix <<< "$latest"
              version="$major.$minor.$((hotfix + 1))"
            fi
          fi
          if git rev-parse "refs/tags/$version" >/dev/null 2>&1; then
            echo "tag $version already exists" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set version in package.json and manifest.json
        run: |
          node -e "
            const fs = require('node:fs');
            const version = process.env.VERSION;
            for (const file of ['packages/client/package.json', 'packages/client/manifest.json']) {
              const data = JSON.parse(fs.readFileSync(file, 'utf8'));
              data.version = version;
              fs.writeFileSync(file, JSON.stringify(data, null, 2) + '\n');
            }
          "
        env:
          VERSION: ${{ steps.version.outputs.version }}

      - name: Typecheck, test and build
        run: npm run check

      - name: Package the extension
        run: npm run package

      - name: Tag release
        run: |
          git tag "${{ steps.version.outputs.version }}"
          git push origin "${{ steps.version.outputs.version }}"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<'EOF'
          ### Install

          1. Download `tapthat.zip` below and unzip it.
          2. Open `chrome://extensions` (Chrome) or `arc://extensions` (Arc).
          3. Turn on **Developer mode**.
          4. Click **Load unpacked** and select the unzipped folder.

          On `localhost` a floating button appears automatically. Elsewhere, use
          **Alt+Shift+C** or the toolbar icon.
          EOF
          gh release create "${{ steps.version.outputs.version }}" packages/client/tapthat.zip \
            --title "${{ steps.version.outputs.version }}" \
            --notes-file notes.md

      # A workflow run can't be started by a tag the workflow token pushed, but
      # it can be dispatched, on that tag.
      - name: Publish tapthat-server with the same version
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: gh workflow run server-release.yml --ref "$VERSION" -f version="$VERSION"
